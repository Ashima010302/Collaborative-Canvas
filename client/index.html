<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Collaborative Canvas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="toolbar">
    <div class="tool-group">
      <button id="tool-brush" class="tool-btn active" title="Brush">🖌️</button>
      <button id="tool-eraser" class="tool-btn" title="Eraser">🧽</button>
    </div>

    <div class="tool-group" id="color-group">
      <button class="color-swatch active" data-color="#111111"></button>
      <button class="color-swatch" data-color="#e6194b"></button>
      <button class="color-swatch" data-color="#3cb44b"></button>
      <button class="color-swatch" data-color="#4363d8"></button>
      <button class="color-swatch" data-color="#f58231"></button>
      <button class="color-swatch" data-color="#911eb4"></button>
    </div>

    <div class="tool-group">
      <label for="width-slider">Size</label>
      <input type="range" id="width-slider" min="1" max="40" value="4" />
    </div>

    <div class="tool-group">
      <button id="undo-btn" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redo-btn" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    </div>

    <div class="tool-group" id="users-group">
      <span class="label">Online</span>
      <ul id="user-list"></ul>
    </div>
  </header>

  <main id="board-wrap">
    <canvas id="board"></canvas>
    <div id="cursor-layer"></div>
  </main>

  <script src="canvas.js"></script>
  <script src="websocket.js"></script>
  <script src="main.js"></script>
</body>
</html>
